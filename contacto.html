<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contáctanos · KuraFit</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-head">
    <div class="container">
      <span class="eyebrow">Hablemos</span>
      <h1>Contáctanos</h1>
      <p class="text-muted-k mb-0">Pedidos, cotizaciones, eventos o cualquier duda: te respondemos con gusto.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="d-grid gap-3">
            <div class="contact-card d-flex gap-3 reveal">
              <div class="contact-ico"><i class="bi bi-whatsapp"></i></div>
              <div><h5 class="mb-1">WhatsApp</h5><p class="mb-2 text-muted-k" id="waTxt"></p>
                <a id="waBtn" class="btn btn-kura btn-sm" target="_blank" rel="noopener">Escribir ahora</a></div>
            </div>
            <div class="contact-card d-flex gap-3 reveal">
              <div class="contact-ico"><i class="bi bi-clock-fill"></i></div>
              <div><h5 class="mb-1">Horario de atención</h5><p class="mb-0 text-muted-k" id="horarioTxt"></p></div>
            </div>
            <div class="contact-card d-flex gap-3 reveal" id="emailCard" style="display:none!important">
              <div class="contact-ico"><i class="bi bi-envelope-fill"></i></div>
              <div><h5 class="mb-1">Correo</h5><p class="mb-0 text-muted-k" id="emailTxt"></p></div>
            </div>
            <div class="contact-card d-flex gap-3 reveal">
              <div class="contact-ico"><i class="bi bi-geo-alt-fill"></i></div>
              <div><h5 class="mb-1">Entregas</h5><p class="mb-0 text-muted-k">Coordinamos la entrega por WhatsApp.</p></div>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="contact-card reveal">
            <h4 class="mb-1">Envíanos un mensaje</h4>
            <p class="text-muted-k">Al enviar, se abrirá WhatsApp con tu mensaje listo.</p>
            <form id="contactForm" class="row g-3 needs-validation" novalidate>
              <div class="col-md-6">
                <label class="form-label fw-bold" for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold" for="telefono">Teléfono (opcional)</label>
                <input type="tel" class="form-control" id="telefono" name="telefono">
              </div>
              <div class="col-12">
                <label class="form-label fw-bold" for="motivo">Motivo</label>
                <select class="form-select" id="motivo" name="motivo" required>
                  <option value="">Selecciona…</option>
                  <option>Quiero hacer un pedido</option>
                  <option>Pedido para evento</option>
                  <option>Consulta sobre productos</option>
                  <option>Otro</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label fw-bold" for="mensaje">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
              </div>
              <div class="col-12">
                <button class="btn btn-kura" type="submit"><i class="bi bi-whatsapp me-2"></i>Enviar por WhatsApp</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("waTxt").textContent = SITE.whatsappVisible;
      document.getElementById("waBtn").href = waLink("Hola KuraFit, quisiera más información.");
      document.getElementById("horarioTxt").textContent = SITE.horario;
      if (SITE.email) {
        const c = document.getElementById("emailCard");
        c.style.removeProperty("display"); c.style.setProperty("display", "flex", "important");
        document.getElementById("emailTxt").textContent = SITE.email;
      }
    });
  </script>
</body>
</html>
