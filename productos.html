<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos · KuraFit</title>
  <link rel="icon" href="img/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-head">
    <div class="container">
      <span class="eyebrow">Nuestro catálogo</span>
      <h1>Productos KuraFit</h1>
      <p class="text-muted-k mb-0">Elige, agrega al carrito y envía tu pedido por WhatsApp.</p>
    </div>
  </section>

  <section class="section pt-5">
    <div class="container">
      <div id="filters" class="d-flex flex-wrap gap-2 mb-4"></div>
      <div class="row g-4" id="productGrid"></div>
      <p class="small text-muted-k mt-4 mb-0"><i class="bi bi-info-circle me-1"></i>Los precios y la disponibilidad se confirman al momento de coordinar tu pedido por WhatsApp.</p>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
